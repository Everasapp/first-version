name: Repair Cloudflare npm lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - optimization/static-catalog-20261120
    paths:
      - .github/workflows/repair-cloudflare-lockfile.yml
permissions:
  contents: write
jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimization/static-catalog-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize npm lockfile for Cloudflare builds"
          git push
