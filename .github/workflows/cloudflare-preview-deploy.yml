name: Deploy EVERAS preview to Cloudflare Workers

# Deploy only from the isolated preview branch, never from main.
on:
  workflow_dispatch:
  push:
    branches:
      - optimization/static-catalog-20261120

permissions:
  contents: read

concurrency:
  group: everas-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/optimization/static-catalog-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required deployment configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund
      - name: Build for Cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run cf:build
      - name: Diagnose OpenNext WASM module paths
        run: |
          echo "Available yoga.wasm files:"
          find .open-next node_modules/next -name yoga.wasm -print | head -20
          echo "Generated references to yoga.wasm:"
          grep -n -o -E '.{0,100}yoga\\.wasm.{0,100}' .open-next/server-functions/default/handler.mjs | head -5 || true
          echo "OpenNext server function directory:"
          ls -la .open-next/server-functions/default | head -25
      - name: Normalize absolute WASM imports for Wrangler
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = '.open-next/server-functions/default/handler.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const original = path.resolve('node_modules/next/dist/compiled/@vercel/og/yoga.wasm');
          const target = path.resolve('.open-next/server-functions/default/node_modules/next/dist/compiled/@vercel/og/yoga.wasm');
          if (!fs.existsSync(original)) throw new Error('Missing source WASM: ' + original);
          fs.mkdirSync(path.dirname(target), { recursive: true });
          fs.copyFileSync(original, target);
          const marker = '/node_modules/next/dist/compiled/@vercel/og/yoga.wasm';
          const pattern = new RegExp('(["\\x27])(/[^"\\x27]*' + marker.replaceAll('/', '\\/') + ')\\1', 'g');
          let count = 0;
          source = source.replace(pattern, (_whole, quote) => {
            count++;
            return quote + './node_modules/next/dist/compiled/@vercel/og/yoga.wasm' + quote;
          });
          if (count === 0) throw new Error('No absolute yoga.wasm import found');
          fs.writeFileSync(file, source);
          console.log('Rewrote ' + count + ' WASM import(s)');
          NODE
      - name: Deploy to existing everas-preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
