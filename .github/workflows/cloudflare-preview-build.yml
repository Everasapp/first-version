name: Cloudflare preview build (no deploy)
on:
  workflow_dispatch:
  push:
    branches:
      - optimization/static-catalog-20261120
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The branch's package-lock.json has not yet been regenerated.
      # Install without using the old lockfile until it can be updated.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund
      - name: Build OpenNext Cloudflare worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run cf:build
