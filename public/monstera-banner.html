<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monstera — Banner animato</title>
  <style>
    :root {
      --cream: #fdfbf7;
      --ink: #1a2e22;
      --green: #3b5a45;
      --leaf: #c4e4b5;
      --border: #efeae2;
      --cycle: 12s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e5e1d8;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 32px 16px;
    }

    .banner {
      position: relative;
      width: min(1200px, 100%);
      aspect-ratio: 1200 / 300;
      display: flex;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--cream);
      box-shadow: 0 18px 40px rgba(26, 46, 34, 0.12);
    }

    .banner-copy {
      position: relative;
      z-index: 3;
      width: 42%;
      padding: clamp(14px, 2.4vw, 28px) clamp(18px, 3.2vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 1.6vw, 18px);
      background: var(--cream);
      min-width: 0;
    }

    .banner-copy::after {
      content: "";
      position: absolute;
      top: -20%;
      right: -18%;
      width: 55%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--leaf);
      opacity: 0.22;
      pointer-events: none;
    }

    .logo {
      position: relative;
      z-index: 1;
      width: clamp(120px, 16vw, 168px);
      height: auto;
      max-height: 72px;
      object-fit: contain;
      object-position: left center;
      display: block;
      flex-shrink: 0;
    }

    .lead {
      position: relative;
      z-index: 1;
      margin: 0;
      max-width: 20em;
      font-family: Georgia, "Palatino Linotype", "Times New Roman", serif;
      font-size: clamp(13px, 1.4vw, 18px);
      line-height: 1.35;
      color: var(--ink);
      flex-shrink: 1;
    }

    .cta {
      position: relative;
      z-index: 1;
      align-self: flex-start;
      margin: 0;
      padding-bottom: 3px;
      border-bottom: 2.5px solid var(--green);
      color: var(--ink);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      flex-shrink: 0;
    }

    .cta:hover {
      color: var(--green);
    }

    .banner-media {
      position: relative;
      width: 58%;
      height: 100%;
      overflow: hidden;
    }

    .slides {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      animation: slideFade var(--cycle) infinite;
      will-change: opacity;
    }

    .slide:nth-child(1) {
      background-image: url("./images/monstera/slide-1.webp");
      animation-delay: 0s;
    }

    .slide:nth-child(2) {
      background-image: url("./images/monstera/slide-2.webp");
      animation-delay: calc(var(--cycle) / 3);
    }

    .slide:nth-child(3) {
      background-image: url("./images/monstera/slide-3.webp");
      animation-delay: calc(var(--cycle) * 2 / 3);
    }

    .image-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        var(--cream) 0%,
        rgba(253, 251, 247, 0.35) 14%,
        rgba(253, 251, 247, 0) 40%
      );
    }

    .dots {
      position: absolute;
      right: 16px;
      bottom: 14px;
      z-index: 4;
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(253, 251, 247, 0.55);
      box-shadow: 0 0 0 1px rgba(26, 46, 34, 0.15);
      animation: dotPulse var(--cycle) infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: calc(var(--cycle) / 3); }
    .dot:nth-child(3) { animation-delay: calc(var(--cycle) * 2 / 3); }

    @keyframes slideFade {
      0% { opacity: 0; }
      6% { opacity: 1; }
      30% { opacity: 1; }
      36% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes dotPulse {
      0%, 35.9%, 100% { background: rgba(253, 251, 247, 0.45); transform: scale(1); }
      6%, 30% { background: #fdfbf7; transform: scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide,
      .dot {
        animation: none;
      }
      .slide:nth-child(1) {
        opacity: 1;
      }
    }

    .hint {
      margin-top: 18px;
      color: #5c635c;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <a class="banner" href="#" aria-label="Monstera — Scopri lo spazio eventi">
      <div class="banner-copy">
        <img
          class="logo"
          src="./images/monstera/logo.jpg"
          width="168"
          height="135"
          alt="Monstera — Spazio per Eventi e Workshop"
        />
        <p class="lead">
          Ampio e luminoso locale di 200 mq in affitto per eventi e workshop di
          qualsiasi genere.
        </p>
        <span class="cta">Scopri Monstera →</span>
      </div>

      <div class="banner-media" aria-hidden="true">
        <div class="slides">
          <div class="slide"></div>
          <div class="slide"></div>
          <div class="slide"></div>
        </div>
        <div class="image-overlay"></div>
        <div class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </a>
    <p class="hint">Alterna 3 foto ogni 4 secondi · ciclo 12s · riduci motion rispettato</p>
  </div>
</body>
</html>
